<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body and initiative mockup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0806;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:#eadcbc;
  font-family:Georgia,serif;background:radial-gradient(ellipse 70% 60% at 38% 45%,#3b2a1b 0%,#20170f 55%,#0d0906 100%)}
h1{position:absolute;left:40px;top:22px;font:700 26px/1 Georgia,serif;letter-spacing:.14em;color:#f0d79e}
h1 small{display:block;margin-top:8px;font:17px/1 Georgia,serif;letter-spacing:0;color:#b9a27c}
canvas{position:absolute;left:40px;top:96px}
#side{position:absolute;left:1000px;top:96px;width:880px;font-size:17px;line-height:1.35}
#side h2{font:700 15px/1 Georgia,serif;letter-spacing:.16em;color:#f0d79e;margin:0 0 12px}
#init{display:flex;gap:34px;align-items:flex-end;padding:18px 20px 26px;background:#16110c;border:1px solid #7d5c28;border-radius:4px;margin-bottom:12px}
.coin{position:relative;width:60px;height:60px;border-radius:50%;flex:none;background:#2a2017;--side:#c9473a;box-shadow:0 0 0 3px var(--side)}
.coin.p{--side:#5b8fc0}
.coin img{width:100%;height:100%;border-radius:50%;display:block}
.coin .hp{position:absolute;left:6px;right:6px;bottom:-9px;height:4px;border-radius:2px;background:#120d08}
.coin .hp i{display:block;height:100%;border-radius:2px;background:#7fa557}
.coin.low .hp i{background:#d0493a}
.coin.dying img{filter:grayscale(.85) brightness(.7)}
.coin.dying .hp i{background:#d0493a;width:100%!important;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.35}}
.coin.stable img{filter:grayscale(1) brightness(.62)}
.coin.stable .hp i{background:#c9a35e;width:100%!important}
.coin.dead{box-shadow:0 0 0 3px #4a3a28}
.coin.dead img{filter:grayscale(1) brightness(.4) contrast(.9)}
.coin.dead .hp{display:none}
.coin .mk{position:absolute;right:-10px;top:-10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font:700 15px/1 Georgia,serif;background:#120d08;border:2px solid var(--c);color:var(--c)}
.coin.dead:before{content:"";position:absolute;inset:-2px;border-radius:50%;
  background:linear-gradient(45deg,transparent 43%,#c9473a 43% 57%,transparent 57%)}
.coin.now{width:76px;height:76px;box-shadow:0 0 0 2px #120d08,0 0 0 4px #f0d79e,0 0 0 6px #120d08,0 0 22px rgba(240,215,158,.45)}
.cap{position:absolute;top:100%;margin-top:12px;left:50%;transform:translateX(-50%);font:600 12px/1 Georgia,serif;letter-spacing:.06em;color:#b9a27c;white-space:nowrap}
.cap.now{color:#f0d79e}
#fan{position:absolute;inset:0;pointer-events:none}
.slip{position:absolute;width:330px;background:#eadcbc;color:#24180e;border:1px solid #7d5c28;border-radius:3px;padding:10px 12px 12px;box-shadow:0 8px 22px rgba(0,0,0,.6)}
.slip h3{font:700 12px/1 Georgia,serif;letter-spacing:.18em;color:#7d5c28;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:3px;margin-bottom:4px;border:2px solid transparent}
.row img{width:42px;height:42px;border-radius:50%;border:3px solid var(--c)}
.row b{display:block;font:700 16px/1.1 Georgia,serif}
.row span{font-size:15px;color:#4a3522}
.row em{margin-left:auto;font:700 15px/1 Georgia,serif;font-style:normal;color:#9a2f22;text-align:right}
.row.sel{background:#f3e8cc;border-color:#c9a35e}
.row.off{opacity:.45}.row.off img{filter:grayscale(1)}
.row.off em{color:#6b5a44;font-weight:400;font-size:14px}
.tag{position:absolute;font:700 14px Georgia,serif;letter-spacing:.12em;color:#f0d79e}
#note{font-size:15px;color:#b9a27c;margin-bottom:26px}
#legend div{margin-bottom:14px}
#legend b{color:#f0d79e}
</style>
</head>
<body>
<div id="stage">
<h1 id="title"></h1>
<canvas id="c" width="900" height="900"></canvas>
<div id="side"></div><div id="fan"></div>
</div>
<script>
const VARIANTS={
  a:{name:"A · THE BODY LIES BENEATH",sub:"The body is drawn as a fallen token under the standing one, shifted down-left and tilted. The fighter keeps the cell; a corner badge counts what is underneath.",mode:"under"},
  b:{name:"B · MARK ON THE FLOOR",sub:"The body leaves a chalk-and-blood mark on the floor; the standing token is centred and untouched. A badge counts what lies there. Hover lists the stack.",mode:"mark"},
  d:{name:"A · PICKING WHO IN THE STACK",sub:"Same stack, now with an action armed. Double-click takes the first legal target; the +N badge (or a second click on the cell) fans the stack out as paper cards, one per occupant, with the action's preview. Illegal ones are greyed with the reason.",mode:"pick"},
  c:{name:"C · SPLIT CELL",sub:"Both tokens shrink and sit side by side in the cell, each at 60%, the body greyed and tilted. Nothing overlaps; the cell tooltip names both.",mode:"split"}
};
const q=new URLSearchParams(location.search).get("state")||"a", V=VARIANTS[q]||VARIANTS.a;
const PICK=q==="d";
document.getElementById("title").innerHTML=V.name+"<small>"+V.sub+"</small>";
const C=100,cv=document.getElementById("c"),g=cv.getContext("2d");
const names=["ogre","human","gob0","gnoll","kenku","hob"],tok=names.map(n=>{const i=new Image();i.src="img/"+n+".png";return i;});
const floor=new Image();floor.src="img/floor.jpg";
Promise.all([...tok,floor].map(i=>new Promise(r=>i.complete?r():i.onload=r))).then(()=>{draw();PICK?fan():hud();});
function cell(x,y){g.drawImage(floor,(x*37%20)*50,(y*53%20)*50,100,100,x*C,y*C,C,C);g.fillStyle="rgba(48,30,14,.45)";g.fillRect(x*C,y*C,C,C);
  g.strokeStyle="rgba(10,6,3,.8)";g.lineWidth=2;g.strokeRect(x*C+.5,y*C+.5,C-1,C-1);}
function token(cx,cy,r,i,col,o={}){
  g.save();g.translate(cx,cy);if(o.rot)g.rotate(o.rot);
  g.shadowColor="rgba(0,0,0,.6)";g.shadowBlur=8;g.shadowOffsetY=3;
  g.beginPath();g.arc(0,0,r,0,7);g.fillStyle="#2a2017";g.fill();g.shadowColor="transparent";
  g.save();g.beginPath();g.arc(0,0,r,0,7);g.clip();
  if(o.grey)g.filter="grayscale(1) brightness(.62)";
  g.drawImage(tok[i],-r,-r,2*r,2*r);g.restore();
  g.strokeStyle=o.ring||col;g.lineWidth=o.grey?3:5;g.beginPath();g.arc(0,0,r,0,7);g.stroke();
  g.restore();}
function badge(cx,cy,t,col){g.beginPath();g.arc(cx,cy,11,0,7);g.fillStyle="#120d08";g.fill();g.strokeStyle=col;g.lineWidth=2;g.stroke();
  g.fillStyle=col;g.font="700 14px Georgia";g.textAlign="center";g.textBaseline="middle";g.fillText(t,cx,cy+1);}
function bloodMark(cx,cy){g.save();g.translate(cx,cy);
  g.fillStyle="rgba(120,28,20,.55)";g.beginPath();g.ellipse(4,8,58,40,.4,0,7);g.fill();
  g.strokeStyle="rgba(214,196,160,.8)";g.lineWidth=3;g.lineCap="round";
  g.beginPath();g.moveTo(-44,-30);g.lineTo(44,30);g.moveTo(44,-30);g.lineTo(-44,30);g.stroke();g.restore();}
function label(t,x,y){g.font="700 14px Georgia";g.textAlign="left";g.textBaseline="alphabetic";g.fillStyle="#f0d79e";g.shadowColor="#000";g.shadowBlur=4;g.fillText(t,x,y);g.shadowBlur=0;}
function pickBoard(){
  for(let y=0;y<9;y++)for(let x=0;x<9;x++)cell(x,y);
  const R=C*.42,cx=450,cy=450;
  g.strokeStyle="#f0d79e";g.lineWidth=3;g.setLineDash([8,5]);g.strokeRect(cx-C/2+2,cy-C/2+2,C-4,C-4);g.setLineDash([]);
  token(cx-13,cy+13,R*.7,4,"#5b8fc0",{grey:1,ring:"#c9a35e",rot:-.7});
  token(cx+14,cy+13,R*.7,5,"#5b8fc0",{grey:1,ring:"#c9a35e",rot:.9});
  token(cx,cy-10,R*.78,1,"#5b8fc0");
  badge(cx+C*.38,cy+C*.38,"+2","#c9a35e");
  label("ONE STANDING ALLY OVER TWO DOWNED ALLIES",cx-120,cy-70);
}
function draw(){if(PICK)return pickBoard();
  for(let y=0;y<9;y++)for(let x=0;x<9;x++)cell(x,y);
  const R=C*.42;
  // plain reference: an ordinary standing fighter, and a lone body
  token(150,150,R,1,"#5b8fc0");label("ALONE",100,222);
  // a lone body (nobody on top)
  if(V.mode==="mark"){bloodMark(450,150);token(450,150,R,2,"#c9473a",{grey:1,ring:"#6b5a44",rot:.5});}
  else token(450,150,R,2,"#c9473a",{grey:1,ring:"#6b5a44",rot:.5});
  label("BODY ALONE",394,222);
  // the contested cell: ally stands on a goblin's body
  const cx=250,cy=450;
  if(V.mode==="under"){
    token(cx-11,cy+11,R*.8,2,"#c9473a",{grey:1,ring:"#6b5a44",rot:-.6});
    token(cx+9,cy-9,R*.8,1,"#5b8fc0");
    badge(cx+C*.38,cy+C*.38,"+1","#c9a35e");
  }else if(V.mode==="mark"){
    bloodMark(cx,cy);token(cx,cy,R,1,"#5b8fc0");
    badge(cx+C*.38,cy+C*.38,"+1","#c9a35e");
  }else{
    token(cx-24,cy+6,R*.62,2,"#c9473a",{grey:1,ring:"#6b5a44",rot:-.5});
    token(cx+24,cy-4,R*.7,1,"#5b8fc0");
  }
  label("FIGHTER OVER BODY",cx-70,cy+82);
  // two bodies and a fighter
  const dx=650,dy=450;
  if(V.mode==="under"){
    token(dx-13,dy+13,R*.7,2,"#c9473a",{grey:1,ring:"#6b5a44",rot:-.7});
    token(dx+14,dy+13,R*.7,3,"#c9473a",{grey:1,ring:"#6b5a44",rot:.9});
    token(dx,dy-10,R*.78,0,"#c9473a");badge(dx+C*.38,dy+C*.38,"+2","#c9a35e");
  }else if(V.mode==="mark"){
    bloodMark(dx,dy);token(dx,dy,R,0,"#c9473a");badge(dx+C*.38,dy+C*.38,"+2","#c9a35e");
  }else{
    token(dx-26,dy+22,R*.5,2,"#c9473a",{grey:1,ring:"#6b5a44",rot:-.5});
    token(dx+26,dy+22,R*.5,3,"#c9473a",{grey:1,ring:"#6b5a44",rot:.8});
    token(dx,dy-14,R*.64,0,"#c9473a");badge(dx+C*.38,dy+C*.38,"+2","#c9a35e");
  }
  label("TWO BODIES",dx-50,dy+82);
  // dying but not dead (still a live token, bleeding) beside a stable one
  token(150,750,R,1,"#5b8fc0",{});g.fillStyle="rgba(120,28,20,.35)";g.beginPath();g.arc(150,750,R,0,7);g.fill();badge(150+C*.38,750+C*.38,"3","#d0493a");
  label("DYING (turns left)",74,822);
  token(450,750,R,1,"#5b8fc0",{grey:1,ring:"#c9a35e"});badge(450+C*.38,750+C*.38,"♥","#c9a35e");
  label("DOWN, STABLE",396,822);
  token(750,750,R,2,"#c9473a",{grey:1,ring:"#6b5a44",rot:.5});
  label("DEAD",722,822);
}
function fan(){
  const R=(n,col,name,state,right,cls)=>`<div class="row ${cls||""}" style="--c:${col}"><img src="img/${n}.png"><div><b>${name}</b><span>${state}</span></div><em>${right}</em></div>`;
  document.getElementById("fan").innerHTML=
   `
    <div class="slip" style="left:1020px;top:96px"><h3>ATTACK ARMED · SWORD · A FOE STANDS OVER YOUR FALLEN</h3>
      ${R("ogre","#c9473a","Ogre","standing · wounded","hit 62%","sel")}
      ${R("kenku","#5b8fc0","Sela (yours)","dying · 1 turn left","ally","off")}
      <span style="font-size:14px">Double-click: the Ogre, the one standing. Allies in the stack are not targets; they stay in the card so you can see who is underneath.</span></div>
    <div class="slip" style="left:1020px;top:352px"><h3>ATTACK ARMED · SWORD · A BODY TO FINISH</h3>
      ${R("gob0","#c9473a","Goblin","standing · fresh","hit 71%","sel")}
      ${R("gnoll","#c9473a","Gnoll","dying · 2 turns left","hit 95%")}
      <span style="font-size:14px">Double-click strikes the standing Goblin. Clicking the Gnoll's row finishes the body instead.</span></div>
    <div class="slip" style="left:1020px;top:588px"><h3>STABILIZE ARMED · THE CELL ON THE BOARD</h3>
      ${R("human","#5b8fc0","Aldric","standing","not downed","off")}
      ${R("kenku","#5b8fc0","Sela","dying · 1 turn left","saves","sel")}
      ${R("hob","#5b8fc0","Brann","dying · 2 turns left","saves")}
      <span style="font-size:14px">Two legal targets: double-click opens this card, first one highlighted. 1 to 3, click, or Tab; Enter confirms.</span></div>
    <div class="slip" style="left:1380px;top:96px;width:500px"><h3>RULES</h3>
      <span style="font-size:15px;line-height:1.35">One legal target: the action goes straight through, no card.<br>Several legal: the card opens, the top legal one highlighted.<br>Hover on the cell lists the whole stack; hover on a row lifts that token out of the stack on the board.<br>The card closes on Esc, or a click outside it.</span></div>`;
}
function hud(){
  const P=(n,cls,mk,cap,hp,now)=>`<div class="coin ${cls}${now?" now":""}" ${mk&&mk[2]?`style="--c:${mk[1]}"`:""}><img src="img/${n}.png">${hp==null?"":`<div class="hp"><i style="width:${hp*100}%"></i></div>`}${mk?`<div class="mk" style="--c:${mk[1]}">${mk[0]}</div>`:""}<div class="cap${now?" now":""}">${cap}</div></div>`;
  const row=[
    P("human","p",null,"NOW",.8,true),
    P("ogre","",null,"HEALTHY",.9),
    P("gnoll","low",null,"WOUNDED",.3),
    P("gob0","dying",["3","#d0493a"],"DYING",1),
    P("hob","p stable",["♥","#c9a35e"],"STABLE",1),
    P("kenku","dead",["✝","#9a2f22"],"DEAD",null)
  ].join("");
  document.getElementById("side").innerHTML=
   `<h2>INITIATIVE CHAIN</h2><div id="init">${row}</div>
    <div id="note">Same chain, six states. The bar under each portrait is no longer the only signal.</div>
    <div id="legend">
    <div><b>Dying.</b> Portrait greyed and dimmed, red bar pulses full, a red mark counts the turns left before death.</div>
    <div><b>Down and stable.</b> Portrait fully grey, brass bar, a brass heart mark. It will not die, and it does not act.</div>
    <div><b>Dead.</b> Darkest grey, ring gone to wood, struck through with one blood-red line, a cross mark, no bar. Dead coins stay in the chain at the end, never removed mid-round.</div>
    <div><b>On the board</b> the same grammar holds: a dying token is red-washed with its count, a stable one is grey with a brass ring, a dead one is a grey tilted token with a wooden ring.</div>
    <div style="margin-top:22px;font-size:15px;color:#b9a27c">The three variants above differ only in how a body and a fighter share a cell. The initiative chain is the same in all three.</div>
    </div>`;
}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById("stage").style.transform=`scale(${s})`;}
fit();addEventListener("resize",fit);
</script>
</body>
</html>
