<div id="top">
  <div class="cartouche"><div class="place" id="place"></div><div class="sub" id="sub"></div></div>
  <div id="init"></div>
  <div id="topright"><div class="ghost-btn" id="skiptraps" hidden data-t="battle.skip_traps"></div><div class="ghost-btn" id="skipplace" hidden data-t="battle.skip_place"></div><div class="ghost-btn" id="skipplaces" hidden data-t="battle.skip_places"></div><div class="ghost-btn" id="withdraw" hidden data-t="battle.withdraw"></div><div class="ghost-btn" id="newfight" data-t="battle.new_fight"></div><div class="ghost-btn" id="menubtn" data-t="battle.menu"></div></div>
</div>

<div id="sheet">
  <canvas id="board"></canvas>
  <canvas id="overlay"></canvas>
  <div id="tokens"></div>
  <div id="fx"></div>
  <div id="ritual" hidden></div>
  <div id="held" hidden></div>
  <div id="banner"></div>
  <div id="pile" class="paper" hidden></div>
  <div id="loot" class="paper" hidden></div>
  <div id="draw" class="paper" hidden></div>
  <div id="ledger" class="paper" hidden></div>
</div>

<div id="right">
  <div class="paper bestiary" id="inspect"></div>
  <div class="paper chron"><div class="kicker" data-t="battle.chronicle"></div><div class="entries" id="log"></div><div class="tray" id="tray"></div></div>
</div>

<div id="bottom">
  <div class="unit leather" id="unit"></div>
  <div class="bar">
    <div class="hint"><span id="hint"></span>
      <div class="tabs" id="tabs"><span data-tab="combat" data-t="battle.combat"></span><span data-tab="utility" data-t="battle.utility"></span></div></div>
    <div class="platerow">
      <div class="platebox"><div class="plates" id="plates"></div>
        <div class="nudge l" id="nudgeL">&lsaquo;</div><div class="nudge r" id="nudgeR">&rsaquo;</div></div>
      <div class="fixed" id="fixed"></div>
    </div>
    <div class="paper spellbook" id="spellbook" hidden></div>
  </div>
  <div class="seal" id="seal"><div><div class="ico mask" style="--icon:url(/assets/icons/gui/halt.svg)"></div><b data-t="battle.end_turn"></b><small>0</small></div></div>
</div>

<div id="dialog" hidden></div>
<div id="modal" hidden></div>
<div id="pause" hidden>
  <div class="leather">
    <div class="tagline" data-t="pause.waits"></div>
    <h3 data-t="battle.menu"></h3>
    <div class="pm" data-pause="resume"><span class="num">I</span><span data-t="pause.resume"></span><span class="hint">Esc</span></div>
    <div class="pm off" data-pause="save"><span class="num">II</span><span data-t="pause.save"></span><span class="hint" data-t="battle.no_save"></span></div>
    <div class="pm" data-pause="settings"><span class="num">III</span><span data-t="pause.settings"></span></div>
    <div class="pm" data-pause="wiki"><span class="num">IV</span><span data-t="pause.wiki"></span></div>
  </div>
</div>
