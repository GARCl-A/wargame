<div id="maptable">
  <div id="top">
    <div class="gname">
      <div class="shield">
        <div class="rim"></div>
        <div class="body"></div>
        <div class="ico mask" id="emblem"></div>
      </div>
      <div>
        <h1 id="guildname"></h1><small id="guildsub"></small>
      </div>
    </div>
    <div class="clock">
      <svg class="dial" viewBox="0 0 86 46" id="dial"></svg>
      <div>
        <div class="day"><span data-t="map.day"></span><em id="day"></em></div>
        <div class="hour"><b id="time"></b><i id="part"></i></div>
      </div>
    </div>
    <div class="alerts" id="alerts"></div>
    <div class="ledger" id="ledger"></div>
    <div class="topbtns">
      <div class="ghost-btn" id="guildbtn"><span class="ico mask"
          style="--icon:url(/assets/icons/gui/bookmark.svg)"></span><span id="guildlbl" data-t="map.guild"></span></div>
      <div class="ghost-btn" id="titlebtn" data-t-tip="map.menu_tip" data-t="map.menu"></div>
    </div>
  </div>

  <div id="bands" class="leather">
    <div class="lk"><span data-t="map.bands"></span> <em id="bandsnote"></em></div>
    <div id="bandlist"></div>
  </div>

  <div id="sheet">
    <canvas id="map" width="1060" height="946"></canvas>
    <div id="nodes"></div>
    <div id="slip" class="tip" hidden></div>
    <div id="news" hidden></div>
    <div class="zoom">
      <div id="zin" data-t-tip="map.zoom_in">+</div>
      <div id="zout" data-t-tip="map.zoom_out">−</div>
      <div class="fit" id="zfit" data-t-tip="map.fit_tip" data-t="map.fit"></div>
    </div>
  </div>

  <div id="insp">
    <div class="place" id="place"></div>
    <div id="inspscroll">
      <div class="camp leather" id="camp"></div>
    </div>
    <div id="log">
      <div id="loghead" data-t-tip="map.log_tip">
        <span class="kicker" data-t="map.log"></span>
        <span class="warn" id="logwarn"></span>
        <span class="count" id="logcount"></span>
        <span class="lens"><svg viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" /><line x1="10" y1="10" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="2" /></svg></span>
      </div>
      <div id="logbody"></div>
    </div>
    <div id="cta" class="leather">
      <div class="ctacol">
        <p id="ctatext"></p>
        <div class="ghost-btn" id="swift" hidden></div>
      </div>
      <div class="seal" id="seal"></div>
    </div>
  </div>

  <div id="wiped" hidden>
    <div class="paper">
      <div class="kicker" data-t="map.wiped_h"></div>
      <p data-t="map.wiped"></p>
      <div class="ghost-btn" id="wipedbtn" data-t="map.to_title"></div>
    </div>
  </div>
  <div id="turn" hidden>
    <div class="paper">
      <div class="kicker" id="turnband"></div>
      <h2 id="turnname"></h2>
      <div class="where" id="turnnode"></div>
      <div class="act" id="turnact"></div>
      <p id="turncrew"></p>
      <div class="lbtns">
        <div class="brass-btn" id="turngo" data-t="map.go_on"></div>
      </div>
    </div>
  </div>
  <div id="logsearch" hidden>
    <div class="paper">
      <div class="x" data-logclose>✕</div>
      <div class="kicker" data-t="map.log_search"></div>
      <h2 data-t="map.what_happened"></h2>
      <div class="sbox"><input id="logq" autocomplete="off" spellcheck="false"></div>
      <div class="chips" id="logkinds"><span class="lbl" data-t="map.what"></span></div>
      <div class="chips" id="logbands"><span class="lbl" data-t="map.who"></span></div>
      <div class="results" id="logresults"></div>
      <div class="rcount"><span id="logfound"></span><span data-t="map.esc_closes"></span></div>
    </div>
  </div>
  <div id="logfull" hidden>
    <div class="paper">
      <div class="kicker" data-t="map.log"></div>
      <h2 data-t="map.log_full"></h2>
      <p id="logfulltext"></p>
      <div class="opts">
        <div class="opt" data-logfull="export"><b data-t="map.export"></b><span data-t="map.export_sub"></span></div>
        <div class="opt" data-logfull="discard"><b data-t="map.drop"></b><span data-t="map.drop_sub"></span></div>
        <div class="opt" data-logfull="raise" id="lograise"><b data-t="map.keep_more"></b><span id="lograisenote"></span></div>
      </div>
      <div class="later" data-logfull="later" data-t="map.later"></div>
    </div>
  </div>
  <div id="leave" hidden>
    <div class="paper">
      <div class="kicker" data-t="map.leave_h"></div>
      <div id="leavebody"></div>
      <div class="lbtns">
        <div class="ghost-btn" data-leave="stay" data-t="map.stay"></div>
        <div class="ghost-btn" data-leave="cargo" data-t="map.manage_cargo"></div>
        <div class="brass-btn" data-leave="go" data-t="map.leave_go"></div>
      </div>
    </div>
  </div>
  <div id="pause" hidden>
    <div class="leather">
      <div class="tagline" data-t="pause.waits"></div>
      <h3 id="pausename"></h3>
      <div class="pm" data-pause="resume"><span class="num">I</span><span data-t="pause.resume"></span><span class="hint">Esc</span></div>
      <div class="pm" data-pause="save"><span class="num">II</span><span data-t="pause.save"></span><span class="hint" id="savednote"></span>
      </div>
      <form id="saveform" hidden><input id="savename" maxlength="40" spellcheck="false"
          autocomplete="off">
        <div class="ghost-btn" id="savego" data-t="pause.save_btn"></div>
      </form>
      <div class="pm" data-pause="settings"><span class="num">III</span><span data-t="pause.settings"></span></div>
      <div class="pm" data-pause="wiki"><span class="num">IV</span><span data-t="pause.wiki"></span></div>
      <div class="gap"></div>
      <div class="pm" data-pause="title"><span class="num">V</span><span data-t="pause.main"></span><span class="hint" data-t="pause.saved_first"></span></div>
      <div class="pm quiet" data-pause="quit"><span class="num">VI</span><span data-t="pause.quit"></span><span class="hint" data-t="pause.saved_first"></span></div>
    </div>
  </div>
</div>
